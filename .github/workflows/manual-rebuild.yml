name: Manual COPR Rebuild

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if versions unchanged'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      reason:
        description: 'Reason for manual rebuild'
        required: false
        default: 'Manual rebuild requested'

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
    
    - name: Force version update
      if: inputs.force_rebuild == 'true'
      run: |
        chmod +x check_versions.sh
        
        echo "🔄 Forcing version update to trigger COPR rebuild"
        echo "Reason: ${{ inputs.reason }}"
        
        # Force update with custom commit message
        ./check_versions.sh --update --force || true
        
        # Add reason to commit message if changes were made
        if [ -n "$(git status --porcelain)" ]; then
          git add versions.json
          COMMIT_MSG="Force rebuild: ${{ inputs.reason }}
        
        Auto-update versions to trigger COPR rebuild
        Generated by manual workflow trigger"
          git commit --amend -m "$COMMIT_MSG"
          git push --force-with-lease origin main
        fi
    
    - name: Trigger COPR build
      # Nothing else reaches COPR: this repo has no COPR webhook.
      env:
        COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
      run: |
        if [ -z "$COPR_WEBHOOK_URL" ]; then
          echo "ERROR: COPR_WEBHOOK_URL secret is not set; COPR was not asked to build" >&2
          exit 1
        fi
        for pkg in pushpin; do
          id=$(curl -fsS --retry 3 --max-time 60 -X POST "${COPR_WEBHOOK_URL%/}/$pkg/") || {
            echo "ERROR: COPR did not accept the build request for $pkg" >&2
            exit 1
          }
          echo "COPR build $id requested for $pkg"
        done

    - name: Display rebuild info
      run: |
        echo "✅ Rebuild triggered"
        echo "📝 Reason: ${{ inputs.reason }}"
        echo "🔗 Check COPR build status at: https://copr.fedorainfracloud.org/coprs/YOUR_USERNAME/pushpin/"
        echo ""
        echo "Current versions:"
        cat versions.json